
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DVD Logo Bounce</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// DVD logo text and dimensions
const text = 'DVD';
const fontSize = 60;
ctx.font = `bold ${fontSize}px Arial`;
const metrics = ctx.measureText(text);
const w = Math.ceil(metrics.width) + 20;
const h = fontSize + 14;

// Position the logo near the top-left
let x = 50, y = 60;

// Velocity (straight line motion)
let vx = window.innerWidth / 3.5;   // horizontal speed
let vy = -window.innerHeight / 8;    // upward diagonal

function bounce() {
    if (x + w > width || x < 0) {
        vx *= -1;
    }
    if (y + h > height || y < 0) {
        vy *= -1;
    }
}

function draw() {
    ctx.clearRect(0, 0, width, height);

    // Draw DVD logo text in the classic gradient style
    const grd = ctx.createLinearGradient(x, y, x + w, y + h);
    grd.addColorStop(0, '#e52d27');   // bright red
    grd.addColorStop(1, '#b30f0f');   // darker red

    ctx.fillStyle = grd;
    ctx.font = `bold ${fontSize}px Arial`;
    ctx.textBaseline = 'top';
    ctx.fillText(text, x, y);

    // Draw a subtle DVD disc circle behind the text (optional visual flair)
    ctx.beginPath();
    ctx.arc(x + w/2, y + h*0.65, fontSize * 0.4, 0, Math.PI * 2);
    ctx.strokeStyle = grd;
    ctx.lineWidth = 3;
    ctx.stroke();

    bounce();

    x += vx;
    y += vy;

    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
